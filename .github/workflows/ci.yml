name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: foodexpress
          POSTGRES_PASSWORD: foodexpress
          POSTGRES_DB: foodexpress
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: foodexpress
      DB_PASSWORD: foodexpress
      DB_NAME: foodexpress
      JWT_SECRET: ci-test-secret
      JWT_EXPIRES_IN: 1d

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Enable required Postgres extensions
        run: |
          sudo apt-get update -qq && sudo apt-get install -y postgresql-client
          PGPASSWORD=foodexpress psql -h localhost -U foodexpress -d foodexpress -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'
          PGPASSWORD=foodexpress psql -h localhost -U foodexpress -d foodexpress -c 'CREATE EXTENSION IF NOT EXISTS postgis;'

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

      - name: E2E tests
        run: npm run test:e2e